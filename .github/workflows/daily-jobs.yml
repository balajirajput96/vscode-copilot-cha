name: Daily Pharma Job Scan

on:
  schedule:
    - cron: "30 3 * * *"     # 09:00 IST daily
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write             # allow committing jobs.csv + dashboard.md back

concurrency:
  group: daily-pharma-job-scan-main
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-outreach/automation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan (fetch -> extract -> score -> draft -> dashboard)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: openai/gpt-4o-mini
          SCORE_THRESHOLD: "55"
        run: python run_repo.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.csv dashboard.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: daily job scan update"
          for attempt in 1 2 3 4 5; do
            git fetch --prune origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase daily scan results onto the latest main branch" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Failed to push daily scan results after 5 attempts" >&2
          exit 1
